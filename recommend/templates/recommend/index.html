<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>SteamLens AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0b0e14; color: white; }
        .search-container { height: 80vh; display: flex; align-items: center; justify-content: center; flex-direction: column; }
    </style>
</head>
<body>
    <div class="container search-container">
        <h1 class="mb-4">🎮 SteamLens AI</h1>
        <p class="text-secondary mb-4">BERT 기반의 지능형 게임 추천 시스템</p>
        <form action="{% url 'search' %}" method="get" class="w-50">
            <div class="input-group mb-3">
                <input type="text" name="q" class="form-control form-control-lg" placeholder="좋아하는 게임 이름을 입력하세요 (예: Portal 2)">
                <button class="btn btn-primary px-4" type="submit">추천받기</button>
            </div>
            {% if error %}
                <p class="text-danger">{{ error }}</p>
                {% if suggestions %}
                    <p>혹시 이 게임인가요? : 
                        {% for s in suggestions %}<a href="?q={{s}}" class="text-info">{{s}}</a>{% if not forloop.last %}, {% endif %}{% endfor %}
                    </p>
                {% endif %}
            {% endif %}
        </form>
    </div>
</body>
</html>
