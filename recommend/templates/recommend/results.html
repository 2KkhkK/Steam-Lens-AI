<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>추천 결과</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white p-5">
    <div class="container">
        <h1>'{{ query }}'에 대한 AI 추천 결과</h1>
        <hr>
        <div class="row">
            {% for game in results %}
            <div class="col-md-4 mb-4">
                <div class="card bg-secondary text-white">
                    <img src="{{ game.image }}" class="card-img-top" alt="{{ game.name }}">
                    <div class="card-body d-flex flex-column">
    <h5 class="card-title text-truncate" title="{{ game.name }}">{{ game.name }}</h5>

    <p class="card-text text-muted mb-3"><small>AI 매칭 점수: {{ game.similarity }}점</small></p>

    <div class="mt-auto d-flex justify-content-between align-items-center">
        <span class="badge bg-primary">Metascore: {{ game.score }}</span>
        
        <span class="fw-bold text-success">
            {% if game.price == 0 %}
                Free to Play
            {% else %}
                ${{ game.price }}
            {% endif %}
        </span>
    </div>
</div>
                </div>
            </div>
            {% endfor %}
        </div>
        <a href="{% url 'index' %}" class="btn btn-outline-light">다시 검색하기</a>
    </div>
</body>
</html>
