<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>추천 결과</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white p-5">
    <div class="container">
        <h1>'{{ query }}'에 대한 AI 추천 결과</h1>
        <hr>
        <div class="row">
            {% for game in results %}
            <div class="col-md-4 mb-4">
                <div class="card bg-secondary text-white">
                    <img src="{{ game.image }}" class="card-img-top" alt="{{ game.name }}">
                    <div class="card-body">
                        <h5 class="card-title">{{ game.name }}</h5>
                        <p class="card-text">유사도: {{ game.similarity }}%</p>
                        <p class="badge bg-primary">메타스코어: {{ game.score }}</p>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
        <a href="{% url 'index' %}" class="btn btn-outline-light">다시 검색하기</a>
    </div>
</body>
</html>
